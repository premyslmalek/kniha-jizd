name: Sestavení APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk kniha-jizd.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kniha-jizd-apk
          path: kniha-jizd.apk
      - name: Vydání ke stažení
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nejnovejsi --yes --cleanup-tag || true
          sleep 3
          gh release create nejnovejsi kniha-jizd.apk --target "$GITHUB_SHA" \
            --title "Nejnovější sestavení (č. $GITHUB_RUN_NUMBER)" \
            --notes "Stáhněte soubor kniha-jizd.apk do telefonu a otevřete ho."
